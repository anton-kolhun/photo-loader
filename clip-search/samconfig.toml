version = 0.1

[default.deploy.parameters]
stack_name = "photo-loader-clip-search"
region = "eu-west-1"                 # same region as the EC2 instance running photo-webapp
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
resolve_image_repos = true           # SAM creates and manages the ECR repository
confirm_changeset = false
fail_on_empty_changeset = false
tags = "project=photo-loader component=clip-search"
