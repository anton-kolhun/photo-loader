<style>
    #img_frame { position: relative; display: inline-block; }
    .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 72px;
        font-size: 36px; line-height: 72px; text-align: center; color: #fff; background: rgba(0, 0, 0, .35);
        border: 0; border-radius: 6px; padding: 0; cursor: pointer; }
    .slide-arrow:hover { background: rgba(0, 0, 0, .55); }
    .slide-arrow:disabled { opacity: .35; cursor: default; }
    #loaderBackward { left: 8px; }
    #loaderForward { right: 8px; }
    #img:not([src]) ~ .slide-arrow { display: none; } /* no arrows until the first photo is shown */
</style>
<div id="img_holder" style="height:92%;">
    <div id="img_frame">
        <img id="img" alt="">
        <button id="loaderBackward" class="slide-arrow" title="Попереднє фото (←)"
                onclick="loadImage('PREVIOUS')">&#10094;</button>
        <button id="loaderForward" class="slide-arrow" title="Наступне фото (→)"
                onclick="loadImage('NEXT')">&#10095;</button>
    </div>
</div>
<div class="form-group flex flex-row">
    <select name="year" id="year" style="height:70px;width:150px;font-size:24px;">
        <option value="">Всі фото</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
        <option value="2014">2014</option>
        <option value="2013">2013</option>
        <option value="RETRO">RETRO</option>
    </select>
    <select name="quality" id="quality" style="height:70px;width:200px;font-size:22px;margin-left:18px">
        <option value="HIGH">Висока якість</option>
        <option selected value="MEDIUM">Середня якість</option>
        <option value="LOW">Низька якість</option>
    </select>
    <a id="searchLink" href="search" class="btn btn-outline-primary" title="Пошук фото за описом"
       style="display:none;height:70px;font-size:24px;line-height:56px;margin-left:18px">Пошук</a>
    <div id="spinner" style="width: 3rem; height: 3rem;margin-left:18px;vertical-align:middle"
         class="spinner-border text-primary"></div>
</div>
