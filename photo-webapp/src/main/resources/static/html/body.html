<style>
    /* the photo stage fills the screen above the controls; sized exactly by fitStage() in slideshow.js */
    #img_holder { position: relative; height: calc(100vh - 100px); margin-top: 8px; background: #111;
        border-radius: 6px; overflow: hidden; user-select: none; }
    #img_holder:fullscreen { height: 100vh !important; border-radius: 0; }
    /* iPhone Safari has no Fullscreen API for pages: cover the page with the stage instead */
    #img_holder.pseudo-fullscreen { position: fixed; inset: 0; z-index: 1000; margin: 0; border-radius: 0;
        height: 100vh !important; height: 100dvh !important; }
    html.no-scroll, html.no-scroll body { overflow: hidden; }
    #exitFullscreen { position: absolute; top: 12px; right: 12px; top: max(12px, env(safe-area-inset-top));
        z-index: 3; display: none; width: 44px; height: 44px; font-size: 26px; line-height: 44px; padding: 0;
        color: #fff; background: rgba(0, 0, 0, .45); border: 0; border-radius: 50%; }
    #img_holder:fullscreen #exitFullscreen, #img_holder.pseudo-fullscreen #exitFullscreen { display: block; }
    #img { width: 100%; height: 100%; object-fit: contain; display: block; }
    #img:not([src]) { visibility: hidden; }
    .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 56px;
        height: 72px; font-size: 36px; line-height: 72px; text-align: center; color: #fff;
        background: rgba(0, 0, 0, .35); border: 0; border-radius: 6px; padding: 0; cursor: pointer; }
    .slide-arrow:hover { background: rgba(0, 0, 0, .6); }
    .slide-arrow:disabled { opacity: .35; cursor: default; }
    #loaderBackward { left: 12px; }
    #loaderForward { right: 12px; }
    #img:not([src]) ~ .slide-arrow { display: none; } /* no arrows until the first photo is shown */
    #photoYear { position: absolute; left: 12px; bottom: 12px; z-index: 2; padding: 2px 10px; font-size: 18px;
        color: #fff; background: rgba(0, 0, 0, .55); border-radius: 4px; }
    #photoYear:empty { display: none; }
    #spinner { position: absolute; top: 50%; left: 50%; margin: -1.5rem 0 0 -1.5rem; width: 3rem; height: 3rem;
        z-index: 3; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 0; }
    .controls select, .controls .btn { height: 56px; font-size: 20px; }
    .controls .btn { line-height: 42px; min-width: 56px; }
</style>
<div id="img_holder">
    <img id="img" alt="">
    <button id="loaderBackward" class="slide-arrow" title="Попереднє фото (←)"
            onclick="navigate('PREVIOUS')">&#10094;</button>
    <button id="loaderForward" class="slide-arrow" title="Наступне фото (→)"
            onclick="navigate('NEXT')">&#10095;</button>
    <div id="photoYear"></div>
    <div id="spinner" class="spinner-border text-light"></div>
    <button id="exitFullscreen" title="Вийти з повноекранного режиму (Esc)" onclick="toggleFullscreen()">&times;</button>
</div>
<div class="controls">
    <select name="year" id="year">
        <option value="">Всі фото</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
        <option value="2014">2014</option>
        <option value="2013">2013</option>
        <option value="RETRO">RETRO</option>
    </select>
    <select name="quality" id="quality">
        <option value="HIGH">Висока якість</option>
        <option selected value="MEDIUM">Середня якість</option>
        <option value="LOW">Низька якість</option>
    </select>
    <button id="playButton" class="btn btn-outline-primary" title="Автоматичний показ (пробіл)"
            onclick="toggleAutoplay()">&#9654;</button>
    <button id="fullscreenButton" class="btn btn-outline-primary" title="На весь екран (F)"
            onclick="toggleFullscreen()">&#x26F6;</button>
    <!-- search features: shown only when the server has search enabled -->
    <a id="similarLink" href="search" class="btn btn-outline-primary search-feature"
       title="Знайти схожі фото" style="display:none">Схожі</a>
    <a id="searchLink" href="search" class="btn btn-outline-primary search-feature"
       title="Пошук фото за описом" style="display:none">Пошук</a>
</div>
